[tool.ruff]
line-length = 120

target-version = "py311"

[tool.ruff.lint]
# D1: missing docstrings only; the other pydocstyle rules are style opinions.
select = ["E", "F", "W", "I", "B", "N", "UP", "SIM", "PL", "D1", "ARG", "SLF", "BLE", "G", "C90", "RUF", "PERF"]

[tool.ruff.lint.per-file-ignores]
# The test names state the checked behaviour; docstrings would only repeat them.
"bazel/rules/rules_score/src/tests/*_test.py" = ["D101", "D102"]

[[tool.ty.overrides]]
# The ty lint aspect only searches PyInfo.imports, which @lobster does not declare.
include = ["bazel/rules/rules_score/src/**"]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = ["lobster.**"]
