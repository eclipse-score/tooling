# Today, a root-level (non-nested) component and a class with no alias both
# get an idmap id equal to their plain name, which is also how a sequence
# participant's id is derived. This lets a sequence diagram link to both a
# component and a class purely by matching alias text, without any explicit
# root-anchor/qualification mechanism (that lands in a later PR).
diagram_types:
  component_diagram.puml: component
  class_diagram.puml: class
  sequence_diagram.puml: sequence
links:
  - ["component_diagram.puml#Backend", "sequence_diagram.puml#Backend"]
  - ["class_diagram.puml#IBackend", "sequence_diagram.puml#IBackend"]
