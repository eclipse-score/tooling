# Regression baseline: today a class's idmap id is derived from its label
# text, not its alias, so an aliased class with a display label still
# surfaces the label as the id. This is expected to change once Rule A
# (alias wins) is implemented; the golden then becomes
# `SampleLibraryAPI: "SampleLibraryAPI"`.
diagram_types:
  class_diagram.puml: class
