# One `puml_cli` call covers all six files: each diagram kind resolves as its
# own group (component and class overview + detail, sequence cast + scenario)
# and the resulting ids still link across kinds.
group: true
links:
  - ["component_overview.puml#Recorder", "component_detail.puml#Recorder", "sequence_cast.puml#Recorder"]
  - ["component_detail.puml#Backend", "sequence_cast.puml#Backend"]
  - ["class_overview.puml#Sink", "class_detail.puml#Sink", "sequence_cast.puml#Sink"]
