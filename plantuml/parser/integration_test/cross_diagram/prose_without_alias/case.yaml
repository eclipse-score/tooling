# Regression baseline for the two "Not yet implemented" notes in
# sequence-diagram.md: a prose participant label with no alias is accepted
# (id == the label text), and referring to a declared participant by its
# display name instead of its alias silently creates a second, separate
# implicit participant. Once identity is derived per the label forms, this
# becomes an `errors` case for both.
diagram_types:
  sequence_diagram.puml: sequence
