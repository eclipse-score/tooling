# Regression baseline for F3: the grammar truncates a `::`-qualified
# relationship endpoint to its first segment, so `A --> a::B` looks up a bare
# name `a` instead of resolving `a::B` as a path. This is expected to become a
# passing case once the qualified_identifier grammar accepts `::` in
# relationship endpoints.
diagram_types:
  class_diagram.puml: class
