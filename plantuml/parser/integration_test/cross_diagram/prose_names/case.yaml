# A prose name is rejected even with an alias, and the name of an aliased
# participant is not a reference: naming it in a message is rejected.
diagram_types:
  declared_prose.puml: sequence
  sequence_diagram.puml: sequence
errors:
  declared_prose.puml:
    - "name is free text"
  sequence_diagram.puml:
    - "is the display name of an aliased participant, refer to it by its alias"
