# The design intentionally has no `EventControl` class/relationship of its
# own: `EventControl` only exists as the implementation's recovered field
# type (see transport.cpp). This case checks that `event_control`'s type is
# still resolved as `EventControl &`, not clang's `int` error-recovery
# placeholder -- which would otherwise cause a real "type differs between
# design and implementation" mismatch to be missed here.
should_pass: true
