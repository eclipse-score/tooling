# Coverage justifications for the integration test workspace.
#
# Justified lines count as covered in the EFFECTIVE coverage metric. The line
# is marked in-code with a `COV_JUSTIFIED <id>` comment (src/coverable.cpp);
# this file provides the id, category and reason.
version: 1
justifications:
  - id: itest-positive-branch
    category: other
    platforms: [linux]
    reason: |
      Intentionally uncovered branch: the integration test asserts that a
      justified line raises effective coverage above raw coverage.
