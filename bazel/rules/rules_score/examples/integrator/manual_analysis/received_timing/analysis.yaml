requirements:
  - "OtherLibrary.TimingConstraint@1"
steps:
  - action:
    description: Review OtherLibrary.TimingConstraint@1 and identify the required invocation period, timing interpretation, deployment scope, and scheduler evidence.
  - action:
    description: Inspect the integrator implementation for invocation scheduling and verify worst-case intervals using timer configuration, jitter and execution-time evidence. Record missing evidence.
  - assertion:
    description: Is OtherLibrary.TimingConstraint@1 demonstrably satisfied for all relevant invocations in the reviewed integration context?
    positive: Yes
    negative: No
