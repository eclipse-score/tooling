requirements:
  - "SampleType.SampleAoU@1"
steps:
  - action:
    description: Review SampleType.SampleAoU@1 and identify the shared-memory naming contract, creation paths, and deployment configuration within the integrator's responsibility.
  - action:
    description: Inspect the integration implementation and dependency sources for shared-memory creation and name validation. Record missing contract or deployment evidence.
  - assertion:
    description: Is SampleType.SampleAoU@1 demonstrably satisfied for all shared-memory creation paths in the reviewed integration context?
    positive: Yes
    negative: No
