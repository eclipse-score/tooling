requirements:
  - "OtherLibrary.SpaceConstraint@1"
steps:
  - action:
    description: Review OtherLibrary.SpaceConstraint@1 directly. Record the budget unit, measured resource, system boundary, and whether the limit applies per call, per instance, or to aggregate peak memory. Record any unresolved ambiguity.
  - action:
    description: Review Foo and Compute for object storage, dynamic allocation, stack use, pointer retention, and asynchronous work. Distinguish source-level observations from a complete runtime memory bound.
  - action:
    description: Identify required evidence for maximum concurrency, object lifetimes, target ABI, stack sizes, allocator overhead, and other memory included by the agreed boundary. Record missing evidence rather than assuming it.
  - action:
    description: If the contract and evidence are sufficient, derive a conservative peak bound and compare it with the budget in consistent units. Otherwise explain why no acceptance comparison can yet be made.
  - assertion:
    description: Is OtherLibrary.SpaceConstraint@1 fully defined and demonstrably satisfied in the reviewed integration context, with a justified peak bound and no unresolved assumptions?
    positive: Yes
    negative: No
