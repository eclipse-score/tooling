requirements:
  - "OtherLibrary.ValidInputPointer@1"
steps:
  - action:
    description: Read OtherLibrary.ValidInputPointer@1 and record how the reviewed implementation covers non-nullness, lifetime, and absence of concurrent modification.
  - action:
    description: Enumerate all Compute calls in unit_1 and review the argument object, pointer escapes, lifetime, and possible writers. Confirm the reviewed call sites cover the unit_1 implementation target.
  - action:
    description: Inspect the dependency Compute contract and implementation to confirm the read is synchronous and the pointer is neither retained nor passed to asynchronous work.
  - assertion:
    description: Do all reviewed unit_1 calls satisfy OtherLibrary.ValidInputPointer@1, with no uncovered call sites or unresolved findings?
    positive: Yes
    negative: No
