# lobster_sphinx_needs conversion of the S-CORE requirement need types; each
# requirement kind selects its need type via --need-type.
conversion-rules:
  - need-type: stkh_req
    kind: AssumedSystemReq
    namespace: req
    version-field: version
    description-fields: content
    status-field: status
    exclude-status: [invalid]
  - need-type: feat_req
    kind: FeatReq
    namespace: req
    version-field: version
    description-fields: content
    status-field: status
    exclude-status: [invalid]
  - need-type: comp_req
    kind: CompReq
    namespace: req
    version-field: version
    description-fields: content
    status-field: status
    exclude-status: [invalid]
    tags:
      - derived_from
      - covers
  - need-type: aou_req
    kind: AoU
    namespace: req
    version-field: version
    description-fields: content
    status-field: status
    exclude-status: [invalid]
