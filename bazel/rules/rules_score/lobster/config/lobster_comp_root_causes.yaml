# lobster-trlc configuration for FTA-generated RootCause records referenced by
# component requirements. Unlike lobster_fta_root_causes.yaml this omits the
# `failure_modes` tag: a component report has no "Failure Modes" level for
# those references to resolve against.
inputs:
  - .
conversion-rules:
  - package: ScoreReq
    record-type: RootCause
    namespace: req
    description-fields: title
