# lobster-trlc configuration for root cause assessments. An assessment traces
# to the root causes it covers and to its versioned measures (AoU, CompReq).
inputs:
  - .
to-string-rules:
  - package: ScoreReq
    tuple-type: MeasureId
    to-string:
      - $(item)@$(version)
conversion-rules:
  - package: ScoreReq
    record-type: RootCauseAssessment
    namespace: req
    version-field: version
    description-fields: rationale
    tags:
      - root_causes
      - measures
