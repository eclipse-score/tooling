needs_types_base_options:
  mandatory_options:
    version: "^[0-9]+$"
needs_types:
  feature:
    mandatory_options:
      title: "^.*$"
      color: "^(red|green)$"
      enabled: "^(true|false)$"
    mandatory_links:
      must: target_a
    optional_links:
      related: "target_a, target_c"
  target_a:
    mandatory_options: {}
  target_b:
    mandatory_options: {}
  target_c:
    mandatory_options: {}
