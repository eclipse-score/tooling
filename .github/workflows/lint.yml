name: Python lint
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
jobs:
  lint:
    name: ruff + ty
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Bazel with cache
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          disk-cache: true
          repository-cache: true
          bazelisk-cache: true
      - name: Run ruff and ty (blocking)
        run: |
          bazel build --config=lint --@aspect_rules_lint//lint:fail_on_violation //bazel/rules/rules_score/src/tests/...
      - name: Run ruff and ty
        id: lint
        # Findings are reported but do not block until the existing baseline is clean.
        # //bazel/rules/rules_score/src/tests/... is already clean and gated by the blocking step above.
        continue-on-error: true
        run: |
          bazel build --config=lint --@aspect_rules_lint//lint:fail_on_violation //...
      - name: Report findings
        if: steps.lint.outcome == 'failure'
        run: echo "::warning::ruff/ty findings, see the 'Run ruff and ty' step log"
